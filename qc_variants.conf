cleanup = true

params {
    modules_repo = '/project/alfredo/nextflow/nf_modules'
    outdir = 'QC/variants'
    report_file = "${launchDir}/pipeline_report_varQC.html"
    var_type = "smallvars"
    inputfile = false
    inputdir = false
}

singularity {
  enabled = true
  autoMounts = true
  cacheDir = "/project/alfredo/singularity"
}

report {
    enabled = true
    file = "${params.report_file}"
}

profiles {
    cluster {
    workDir = "/scratch/$USER/nextflow_work"
        executor {
            name = 'slurm'
            queueSize = 200
            pollInterval = '1 min'
            queueStatInterval = '1 min'
            dumpInterval = '1 min'
            queue = 'cpuq'
        }
        process {
            withLabel: highcores {
                cpus = 24
                memory = '64G'
            }
            withLabel: midcores {
                cpus = 12
                memory = '48G'
            }
            withLabel: lowcores {
                cpus = 8
                memory = '32G'
            }
            withLabel: singlethread {
                cpus = 1
                memory = '16G'
            }
            withName: 'QC_RMD_SMALLVARS' {
                container = "${singularity.cacheDir}/vcf_qc_report_v1.sif"
            }
        }
    }
}