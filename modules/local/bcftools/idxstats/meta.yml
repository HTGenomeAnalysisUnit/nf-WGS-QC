# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bcftools_idxstats"
description: Compute per-chromosome variant counts from an indexed VCF/BCF file using bcftools index --stats
keywords:
  - bcftools
  - idxstats
  - vcf
  - bcf
  - variant qc
tools:
  - bcftools:
      description: Utilities for variant calling and manipulating VCFs and BCFs
      homepage: https://samtools.github.io/bcftools/bcftools.html
      documentation: https://samtools.github.io/bcftools/bcftools.html
      tool_dev_url: https://github.com/samtools/bcftools
      doi: 10.1093/gigascience/giab008
      licence:
        - "MIT"
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - vcf:
        type: file
        description: Bgzipped VCF or BCF input file
        pattern: "*.{vcf.gz,bcf}"
        ontologies:
          - edam: http://edamontology.org/format_3016 # VCF
    - tbi:
        type: file
        description: Index file (TBI or CSI) for the input VCF/BCF file
        pattern: "*.{tbi,csi}"
        ontologies: []
output:
  idxstats:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*stats.txt":
          type: file
          description: Tab-separated file with contig name, contig length, and number of variant records
          pattern: "*.bcftools_idxstats.txt"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@edg1983"
maintainers:
  - "@edg1983"
