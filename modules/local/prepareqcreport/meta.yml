# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "prepareqcreport"
description: Merge alignment and variant QC summaries, flag tables, and datavzrd configurations into a unified project QC report
keywords:
  - qc report
  - datavzrd
  - summary
  - alignment qc
  - variant qc
tools:
  - create_qc_report:
      description: Python script combining alignment and variant QC flags, computing project PASS/WARN/FAIL summaries, and generating a unified datavzrd report config
      homepage: https://github.com/HTGenomeAnalysisUnit/nf-WGS-QC
      documentation: https://github.com/HTGenomeAnalysisUnit/nf-WGS-QC
      tool_dev_url: https://github.com/HTGenomeAnalysisUnit/nf-WGS-QC
      doi: ""
      licence:
        - "MIT"
      identifier: ""
input:
  - project_id:
      type: string
      description: Project identifier used as report title and output file prefix
  - align_datavzrd_yml:
      type: file
      description: Datavzrd YAML config generated by summarise_align_qc.py
      pattern: "*.{yml,yaml}"
      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML
  - align_metrics_tsv:
      type: file
      description: Alignment QC metrics summary TSV generated by summarise_align_qc.py
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - align_qc_flags_tsv:
      type: file
      description: Alignment QC flags matrix TSV generated by summarise_align_qc.py
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - align_qc_criteria_tsv:
      type: file
      description: Alignment QC criteria descriptions TSV generated by summarise_align_qc.py
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - var_datavzrd_yml:
      type: file
      description: Datavzrd YAML config generated by summarise_var_qc.py
      pattern: "*.{yml,yaml}"
      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML
  - var_metrics_tsv:
      type: file
      description: Variant QC metrics summary TSV generated by summarise_var_qc.py
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - var_qc_flags_tsv:
      type: file
      description: Variant QC flags matrix TSV generated by summarise_var_qc.py
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - var_qc_criteria_tsv:
      type: file
      description: Variant QC criteria descriptions TSV generated by summarise_var_qc.py
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
output:
  datavzrd_yml:
    - "*.datavzrd.yml":
        type: file
        description: Unified datavzrd YAML configuration linking all project QC views
        pattern: "*.datavzrd.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
  report_js:
    - "*.project_qc_summary.js":
        type: file
        description: Custom JavaScript/HTML renderer for the datavzrd project QC summary view
        pattern: "*.project_qc_summary.js"
        ontologies: []
  qc_summary_tsv:
    - "*.project_qc_summary.tsv":
        type: file
        description: Project-level PASS/WARN/FAIL counts and failure rate stratified by alignment_qc, variants_qc, and total
        pattern: "*.project_qc_summary.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  flags_summary_tsv:
    - "*.qc_flags_summary.tsv":
        type: file
        description: Per-flag PASS/FAIL and PASS/WARN sample counts across all configured QC flags
        pattern: "*.qc_flags_summary.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  flags_tsv:
    - "*.qc_flags.tsv":
        type: file
        description: Merged per-sample QC flags table retaining only flags raised in at least one sample
        pattern: "*.qc_flags.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  versions_prepareqcreport:
    - - ${task.process}:
          type: string
          description: The name of the process
      - prepar_qc_report:
          type: string
          description: The name of the tool
      - "create_qc_report.py --version":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - prepar_qc_report:
          type: string
          description: The name of the tool
      - "create_qc_report.py --version":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@edg1983"
maintainers:
  - "@edg1983"
