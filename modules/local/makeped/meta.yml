# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "makeped"
description: Generate a Somalier-compatible PED pedigree file from a sample manifest TSV
keywords:
  - ped
  - pedigree
  - somalier
  - manifest
  - qc
tools:
  - make_ped:
      description: Python script generating a standard 6-column PED file from a sample manifest TSV
      homepage: https://github.com/HTGenomeAnalysisUnit/nf-WGS-QC
      documentation: https://github.com/HTGenomeAnalysisUnit/nf-WGS-QC
      tool_dev_url: https://github.com/HTGenomeAnalysisUnit/nf-WGS-QC
      doi: ""
      licence:
        - "MIT"
      identifier: ""
input:
  - manifest:
      type: file
      description: Tab-separated manifest file containing sample ID and sex columns
      pattern: "*.{tsv,csv}"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - project_id:
      type: string
      description: Project identifier used as prefix for the generated PED file
output:
  ped_file:
    - "*.ped":
        type: file
        description: Standard 6-column PED pedigree file formatted for Somalier
        pattern: "*.ped"
        ontologies: []
  versions_makeped:
    - - ${task.process}:
          type: string
          description: The name of the process
      - make_ped:
          type: string
          description: The name of the tool
      - "make_ped.py --version | cut -d' ' -f2":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - make_ped:
          type: string
          description: The name of the tool
      - "make_ped.py --version | cut -d' ' -f2":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@edg1983"
maintainers:
  - "@edg1983"
