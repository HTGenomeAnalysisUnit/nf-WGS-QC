# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "qrs"
description: Compute fast sequencing run, flowcell, lane, base quality, and GC statistics from BAM/CRAM files using quick_reads_stats
keywords:
  - bam
  - cram
  - read stats
  - sequencing runs
  - alignment qc
tools:
  - quick_reads_stats:
      description: Rapid extraction of sequencing run, flowcell, lane, base quality, and GC metrics from BAM/CRAM files
      homepage: https://github.com/HTGenomeAnalysisUnit/quick_reads_stats
      documentation: https://github.com/HTGenomeAnalysisUnit/quick_reads_stats
      tool_dev_url: https://github.com/HTGenomeAnalysisUnit/quick_reads_stats
      doi: ""
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: Input BAM or CRAM alignment file
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
          - edam: http://edamontology.org/format_3462 # CRAM
    - bai:
        type: file
        description: Index file corresponding to the input BAM or CRAM file
        pattern: "*.{bai,crai}"
        ontologies: []
output:
  per_sample_run:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*.per_sample_run.tsv":
          type: file
          description: Per-sample summary of sequencing runs, flowcells, and lanes
          pattern: "*.per_sample_run.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  rundetails:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*.rundetails.tsv":
          type: file
          description: Detailed breakdown of reads per sequencing run, flowcell, and lane
          pattern: "*.rundetails.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  read_stats:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*.read_stats.tsv":
          type: file
          description: Per-sample read base quality and GC percentage summary statistics
          pattern: "*.read_stats.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_qrs:
    - - ${task.process}:
          type: string
          description: The name of the process
      - quick_reads_stats:
          type: string
          description: The name of the tool
      - "qrs --help | head -1 | sed 's/.\\+VERSION //'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - quick_reads_stats:
          type: string
          description: The name of the tool
      - "qrs --help | head -1 | sed 's/.\\+VERSION //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@edg1983"
maintainers:
  - "@edg1983"
