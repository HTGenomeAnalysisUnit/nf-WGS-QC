process {

    withName: 'MOSDEPTH' {
        def mosdepth_threshold_arg = params.mosdepth_thresholds ? "-T ${params.mosdepth_thresholds}": ''
        def mosdepth_per_base_coverage_arg = params.mosdepth_per_base_coverage ? '' : '-n' 
        ext.args   = "${mosdepth_per_base_coverage_arg} ${mosdepth_threshold_arg}"
    }
}

