process {
    withName: 'VARIANTS_QC:BCFTOOLS_VIEW' {
        ext.prefix  = { "${meta.id}.filtered" }
        ext.args    = {
            // By default output variants as BCF, and apply configured filters
            def base_filters = "-W -Ob -f ${params.variant_stats_filter}"
            // If input file is a gVCF, apply additional filters to select only variant sites
            def gvcf_filters = meta.file_type == "gvcf" ? '-A -v snps,indels -i \'GT="alt"\'' : ''
            return "${base_filters} ${gvcf_filters}"
        }
    }
}
